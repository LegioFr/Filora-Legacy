<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14181f" />
    <title>Filora — hors connexion</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b111a; color: #f8fafc; }
      main { width: min(520px, calc(100vw - 40px)); padding: 32px; border: 1px solid #293241; border-radius: 18px; background: #121a25; }
      small { color: #38bdf8; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 10px 0 12px; font-size: clamp(28px, 6vw, 42px); }
      p { margin: 0; color: #cbd5e1; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <small>Filora</small>
      <h1>Connexion indisponible</h1>
      <p>Reconnecte l’appareil à Internet puis relance Filora. Aucune donnée de stock n’est copiée dans ce cache hors ligne.</p>
    </main>
  </body>
</html>
