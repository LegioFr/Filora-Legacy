<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Filora</title>
    <script>
      (() => {
        if (new URLSearchParams(window.location.search).get('pwa-debug') !== '1') return

        const state = {
          startedAt: new Date().toISOString(),
          beforeinstallprompt: [],
          appinstalled: [],
        }

        Object.defineProperty(window, '__FILORA_PWA_DEBUG_EARLY__', {
          value: state,
          configurable: true,
        })

        window.addEventListener('beforeinstallprompt', (event) => {
          state.beforeinstallprompt.push({
            at: new Date().toISOString(),
            platforms: Array.isArray(event.platforms) ? [...event.platforms] : [],
          })
        })

        window.addEventListener('appinstalled', () => {
          state.appinstalled.push(new Date().toISOString())
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
