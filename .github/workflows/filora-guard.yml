name: Filora guard

on:
  pull_request:
    branches:
      - test-preview
      - main

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert exact PR HEAD
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git status --short --branch

      - name: Canonical presence
        run: python3 tools/filora_guard.py canonical-presence --root .

      - name: Structured project state
        run: python3 tools/filora_guard.py project-state --file PROJECT_STATE.md

      - name: Human app validation state
        run: python3 tools/filora_guard.py batch-human-validation --root .

      - name: Machine workflow state and objective risk floor
        run: python3 tools/filora_guard.py workflow-state --root . --state workflow/state.json --contract workflow/contract.json --project-state PROJECT_STATE.md --base-ref "origin/${{ github.base_ref }}"

      - name: Guard tests
        run: python3 -m unittest discover -s tests -v

      - name: Architecture direction
        run: python3 tools/check_architecture.py src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck application
        run: npm run typecheck

      - name: Build application
        run: npm run build
