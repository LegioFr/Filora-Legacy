name: Filora guard

on:
  pull_request:
    branches:
      - test-preview
      - main

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert exact PR HEAD
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git status --short --branch

      - name: Canonical presence
        run: python3 tools/filora_guard.py canonical-presence --root .

      - name: Structured project state
        run: python3 tools/filora_guard.py project-state --file PROJECT_STATE.md

      - name: Guard tests
        run: python3 -m unittest discover -s tests -v

      - name: Architecture direction
        run: python3 tools/check_architecture.py src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Commit generated package lock once
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json already tracked'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: lock Batch 1 npm dependencies'
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Typecheck application
        run: npm run typecheck

      - name: Build application
        run: npm run build
