name: Filora guard sentinel

on:
  pull_request_target:
    branches:
      - test-preview
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - name: Reject ordinary PR changes to critical guard surface
        uses: actions/github-script@v7
        with:
          script: |
            const protectedExact = new Set([
              '.github/workflows/filora-guard.yml',
              '.github/workflows/filora-guard-sentinel.yml',
              'DEVELOPMENT.md',
              'workflow/contract.json',
              'tools/filora_guard.py',
              'tools/check_review_governance.py',
              'tools/check_claude_review_prompt.py',
              'tools/check_codex_security_prompt.py',
              'tools/check_architecture.py',
            ]);
            const protectedPrefixes = ['tests/'];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const blocked = files
              .map((file) => file.filename)
              .filter((path) =>
                protectedExact.has(path) ||
                protectedPrefixes.some((prefix) => path.startsWith(prefix))
              );

            if (blocked.length > 0) {
              core.setFailed(
                'Critical guard surface changed by an ordinary PR. ' +
                'Use the explicit critical-governance path with an administrator ruleset bypass after independent validation. ' +
                `Blocked paths: ${blocked.join(', ')}`
              );
            }
